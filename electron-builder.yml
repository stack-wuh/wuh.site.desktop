appId: site.wuh.desktop
productName: wuh-site-desktop
directories:
  output: dist
  buildResources: build
files:
  - out/**
  # Next 静态导出产物：主进程 app:// 协议加载（dist/next 由 next build 生成）
  - dist/next/**
  # 内置官方参考插件：主进程 protocol handler 经 app.getAppPath()/plugins 读取（asar 内 fs 支持）
  - plugins/**
  - package.json
asar: true
npmRebuild: false
electronLanguages:
  - zh-CN
  - en
mac:
  # 分发 target：dmg（挂载安装）+ zip（免挂载直下）；identity null = 无证书 unsigned
  # （下载后首次打开需右键 → 打开；签名/公证待证书就位后启用）
  target:
    - dmg
    - zip
  identity: null
  category: public.app-category.productivity
win:
  # 显式 nsis 安装器（不声明时 electron-builder 默认也是 nsis，显式化防漂移）
  target:
    - nsis
  # 图标路径相对 buildResources（build/）或项目根解析，build/icon.ico 命中项目根；
  # 产物由 scripts/build-icon.mjs 随 dark 变体生成并随仓库提交
  icon: build/icon.ico
